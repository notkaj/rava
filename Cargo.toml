[package]
name = "rava"
version = "0.1.0"
description = "Simple OS Audio Visualizer"
authors = ["kaj <notkaj@gmail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.32"
ratatui = "0.30.0"
tokio = { version = "1.49.0", features = ["full"] }
color-eyre = "0.6.5"
rand = "0.10.0"
# cpal = "0.16.0"
realfft = "3.5.0"
pipewire = "0.9.2"
thiserror = "2.0.17"
bytemuck = "1.24.0"
tui-barchart-ext = "0.1.1"
