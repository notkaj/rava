[package]
name = "rava"
version = "0.1.0"
description = "Simple OS Audio Visualizer"
authors = ["kaj <notkaj@gmail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.31"
ratatui = { version = "0.30.0", features = ["unstable-widget-ref"] }
tokio = { version = "1.50.0", features = ["full"] }
color-eyre = "0.6.5"
rand = "0.10.0"
# cpal = "0.16.0"
realfft = "3.5.0"
pipewire = "0.10.0"
thiserror = "2.0.17"
bytemuck = "1.24.0"
tui-barchart-ext = "0.1.4"
clap = { version = "4.5.60", features = ["derive"] }
bounded-vec-deque = "0.1.1"
toml = { version = "1.0.6", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
better_default = "1.0.5"
